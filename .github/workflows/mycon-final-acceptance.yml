name: MyCON final acceptance — offline safety gates

on:
  pull_request:
    paths:
      - 'repository/scripts/mycon_*'
      - 'repository/pipeline/stage_04_5_cams_gs/**'
      - 'repository/tests/test_mycon_*'
      - 'repository/MyCON_FINAL_ACCEPTANCE.ipynb'
      - '.github/workflows/mycon-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned PR source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax (no GPU needed)
        run: |
          python -m py_compile repository/scripts/mycon_thesis_one_run.py
          python -m py_compile repository/scripts/mycon_longsplat_auto_run.py
          python -m py_compile repository/scripts/mycon_longsplat_autoenv.py
          python -m py_compile repository/scripts/mycon_mast3r_2view_smoke.py
          python -m py_compile repository/scripts/mycon_colmap_gsplat.py
          python -m py_compile repository/scripts/mycon_colmap_gsplat_env.py
          python -m py_compile repository/pipeline/stage_04_5_cams_gs/longsplat_research.py
          python -m py_compile repository/pipeline/stage_04_5_cams_gs/metric_anchor_gate.py
          python -m py_compile repository/pipeline/stage_04_5_cams_gs/longsplat_depth_geometry.py
      - name: Reject notebook syntax and malformed JSON
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          book = json.loads(Path('repository/MyCON_FINAL_ACCEPTANCE.ipynb').read_text())
          assert book['nbformat'] == 4
          for cell in book['cells']:
              if cell['cell_type'] == 'code':
                  ast.parse(''.join(cell['source']))
          print('NOTEBOOK_JSON_AND_PYTHON_SYNTAX_PASS')
          PY
      - name: Run non-destructive acceptance unit tests
        run: |
          python -m unittest discover -s repository/tests -p test_mycon_thesis_one_run.py -v
          python -m unittest discover -s repository/tests -p test_mycon_mast3r_2view_smoke.py -v
          python -m unittest discover -s repository/tests -p test_mycon_nvidia_progress.py -v
          python -m unittest discover -s repository/tests -p test_mycon_colmap_gsplat.py -v
      - name: Validate genuine depth-to-geometry and noncoplanar BIM anchor guards
        run: |
          python -m pip install -q numpy pillow pytest
          python -m pytest -q repository/tests/test_longsplat_research_backend.py
