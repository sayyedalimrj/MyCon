name: MyCON integration CPU contracts
on:
  push:
    branches:
      - research/mycon-integration-20261112
  pull_request:
    branches:
      - research/mycon-integration-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research CPU prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<2' 'scipy>=1.11,<2' 'pytest>=8,<10' 'trimesh>=4,<5' 'matplotlib>=3.8,<4' 'PyYAML>=6' 'Pillow>=10,<13' 'pandas>=2' 'scikit-image>=0.22,<1' 'opencv-python-headless>=4.8,<5' 'requests>=2.31' 'httpx>=0.27,<1'
      - name: Compile code and show dependencies
        run: |
          python --version
          python -m compileall -q pipeline benchmarks tests/test_research_geometry_comparison_ready.py tests/test_comparison_ready_progress_contract.py tests/test_research_validation_model_agnostic.py
      - name: Cross-workstream contracts
        run: |
          python -m pytest -q \
            tests/test_research_geometry_comparison_ready.py \
            tests/test_comparison_ready_progress_contract.py \
            tests/test_research_validation_model_agnostic.py \
            tests/test_research_validation_metrics.py \
            tests/test_research_validation_round2_contract.py \
            tests/test_research_progress_scientific.py \
            tests/test_research_progress_geometry.py \
            tests/test_round2_progress_contract.py \
            tests/test_mycon_integration_geometry.py \
            tests/test_geometry_before_after_audit.py \
            tests/test_final_colab_notebook_integration.py \
            tests/test_colab_notebook_runall_dryrun.py
      - name: Package reviewed research source (candidate; not field-validated)
        run: |
          git archive --format=zip --output=../MyCON_Integration_RC_CPU.zip HEAD
          sha256sum ../MyCON_Integration_RC_CPU.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyCON_Integration_RC_CPU
          path: MyCON_Integration_RC_CPU.zip
          if-no-files-found: error
          retention-days: 14
      - name: Produce and verify official server handoff package
        run: |
          python scripts/export_server_handoff_zip.py --output dist/MyCON_Integration_Server_Handoff_RC.zip
          python -m scripts.verify_server_handoff_zip dist/MyCON_Integration_Server_Handoff_RC.zip
          sha256sum dist/MyCON_Integration_Server_Handoff_RC.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyCON_Integration_Server_Handoff_RC
          path: repository/dist/MyCON_Integration_Server_Handoff_RC.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save exact commit and installed package versions
        if: always()
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          python -m pip freeze | head -100
