name: MyCON Work consolidation
on:
  push:
    branches: [research/mycon-work-consolidation-20261127]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU and native IFC test environment
        run: |
          python -m pip install -r requirements-work-pilot.txt 'pytest==9.2.0' 'ifcopenshell==0.8.3.post2'
      - name: Run frozen R4 test selection and cross-stream regressions
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = Path('../.github/workflows/mycon-six-stream-merge-rehearsal-round4-20261127.yml')
          steps = yaml.safe_load(workflow.read_text())['jobs']['dry-run-six-prs']['steps']
          for step in steps:
              if step.get('working-directory') == 'repository':
                  print(step['name'], flush=True)
                  subprocess.run(['bash', '-c', step['run'].replace('pytest -q', 'pytest -q -rs')], check=True)
          subprocess.run(['python', '-m', 'pytest', '-q', '-rs', 'tests/test_work_consolidation.py'], check=True)
          PY
