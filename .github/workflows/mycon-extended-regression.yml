name: MyCON extended lightweight regression
on:
  push:
    branches:
      - research/mycon-integration-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<2' 'scipy>=1.11,<2' 'opencv-python-headless>=4.8,<4.12' 'open3d>=0.19,<0.20' 'ifcopenshell>=0.8' 'matplotlib>=3.8,<4' 'Pillow>=10,<13' 'pandas>=2' 'trimesh>=4' 'PyYAML>=6' 'pytest>=8,<10' 'pytest-timeout>=2.3' 'scikit-image>=0.22,<1' 'fastapi>=0.110' 'httpx>=0.27,<1' 'requests>=2.31' 'uvicorn>=0.30' 'huggingface_hub>=0.24'
      - name: Compile full Python tree
        run: python -m compileall -q pipeline benchmarks scripts tests
      - name: Full lightweight regression (no real hardware/field assertion)
        run: python -m pytest -q -m lightweight --maxfail=10
