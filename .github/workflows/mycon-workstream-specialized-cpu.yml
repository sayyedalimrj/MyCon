name: MyCON workstream-specific CPU checks
on:
  pull_request:
    branches:
      - research/mycon-integration-20261112
  push:
    branches:
      - research/mycon-integration-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workstream-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'numpy>=1.26,<2' 'scipy>=1.11,<2' 'pytest>=8,<10' 'trimesh>=4,<5' 'matplotlib>=3.8,<4' 'Pillow>=10,<13' 'pandas>=2' 'scikit-image>=0.22,<1' 'opencv-python-headless>=4.8,<5' 'PyYAML>=6'
      - name: Discover and actually run all isolated workstream tests available in checked out HEAD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          root = Path('tests')
          names = (
              'test_research_reconstruction_*.py',
              'test_research_geometry_structural_review.py',
              'test_research_viewer_*.py',
              'test_civil_metric_bim_*.py',
              'test_research_validation_evidence_export.py',
              'test_research_progress_monitor.py',
          )
          found = sorted({str(f) for glob in names for f in root.glob(glob)})
          print('Discovered specialized test files:', len(found), flush=True)
          for name in found:
              print('RUN:', name, flush=True)
          if not found:
              print('NO WORKSTREAM MODULE TEST FILES EXIST IN THIS CHECKOUT. Not evaluated.', flush=True)
              sys.exit(0)
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', *found]))
          PY
      - name: Report exact checked out revision
        if: always()
        run: |
          git rev-parse HEAD
          python --version
